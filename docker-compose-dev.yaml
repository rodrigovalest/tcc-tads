services:
  postgres:
    image: postgres:17.5
    container_name: postgres
    ports:
      - '14000:5432'
    environment:
      POSTGRES_PASSWORD: 123mudar
      POSTGRES_USER: 123mudar
      POSTGRES_DB: 123mudar

  redis:
    image: redis:8.0.1
    container_name: redis
    ports:
      - "6600:6379"

  coturn:
    image: instrumentisto/coturn
    container_name: coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "50000-50010:50000-50010/udp"
    environment:
      - TURN_PORT=3478
      - LISTENING_IP=0.0.0.0
      - EXTERNAL_IP=192.168.0.101
      - REALM=webrtc.example.com
      - USER=webrtcuser:webrctpass
    command:
      - --lt-cred-mech
      - --no-cli
      - --no-tls
      - --no-dtls
      - --min-port=49152
      - --max-port=65535
      - --fingerprint
      - --verbose
      - --realm=webrtc.example.com
      - --user=webrtcuser:webrctpass
